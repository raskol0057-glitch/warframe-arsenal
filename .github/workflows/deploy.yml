name: Сборка и публикация

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * *'   # каждый день, 06:00 UTC (цены с рынка и данные игры)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow
      - uses: actions/cache@v4
        with:
          path: cache
          key: wfcd-${{ github.run_id }}
          restore-keys: wfcd-
      - name: Цены с warframe.market
        run: python prices.py --max-minutes 10
        continue-on-error: true
      - run: python build.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

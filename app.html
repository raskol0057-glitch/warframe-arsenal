<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Warframe Arsenal</title>
<meta name="description" content="Фанатский справочник Warframe: оружие, варфреймы, реликвии, ресурсы, освоение и хроники лора.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jura:wght@500;600;700&family=Exo+2:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<link rel="preload" href="data.json" as="fetch" crossorigin>
<style>
/* Layout: шапка-панель как меню игры; ниже — вид раздела: сетка карточек «Арсенала», таблицы, хроника, профиль; подробности выезжают справа */
:root{
  --void:#060a11; --deep:#0b121e; --panel:#101a29; --panel2:#152238; --line:#23334a; --line2:#36496a;
  --ink:#e6ecf3; --muted:#91a2b8; --gold:#d6b46a; --gold2:#f1d89a; --energy:#5fd4e8; --warn:#e8a87c; --ok:#8fd6a0;
  --f-display:'Jura','Exo 2',system-ui,sans-serif; --f-body:'Exo 2',system-ui,'Segoe UI',sans-serif; --f-data:'JetBrains Mono',ui-monospace,Consolas,monospace;
  --cut:12px; --accent:#d6b46a;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{background:var(--void)}
body{margin:0;min-height:100vh;color:var(--ink);font:15px/1.55 var(--f-body);
  background:radial-gradient(ellipse 90% 55% at 50% -15%,#1a2b46 0%,transparent 60%) no-repeat,var(--void)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--energy)}
:focus-visible{outline:2px solid var(--energy);outline-offset:2px}
.cut{clip-path:polygon(var(--cut) 0,100% 0,100% calc(100% - var(--cut)),calc(100% - var(--cut)) 100%,0 100%,0 var(--cut))}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* Шапка */
.top{position:sticky;top:0;z-index:20;background:rgba(6,10,17,.96);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
.top .wrap{display:flex;align-items:center;gap:18px;min-height:60px}
.logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--gold2);font:700 16px var(--f-display);letter-spacing:.22em;text-transform:uppercase;white-space:nowrap}
.logo svg{width:28px;height:28px}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
nav.tabs::-webkit-scrollbar{display:none}
nav.tabs a{position:relative;padding:20px 13px 18px;color:var(--muted);text-decoration:none;font:600 12.5px var(--f-display);letter-spacing:.14em;text-transform:uppercase;white-space:nowrap}
nav.tabs a:hover{color:var(--ink)}
nav.tabs a.on{color:var(--gold2)}
nav.tabs a.on:after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--gold);box-shadow:0 0 10px var(--gold)}
.who{display:flex;align-items:center;gap:8px;padding:7px 12px;border:1px solid var(--line2);background:var(--panel);text-decoration:none;color:var(--ink);font:600 12px var(--f-display);letter-spacing:.08em;white-space:nowrap}
.who:hover{border-color:var(--gold)}
.who i{width:8px;height:8px;background:var(--gold);transform:rotate(45deg);display:inline-block}

/* Заголовок раздела */
.head{padding-block:26px 6px;display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap}
.eyebrow{font:700 11px var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:var(--gold);display:flex;gap:10px;align-items:center}
.eyebrow:before{content:"";width:24px;height:1px;background:var(--gold)}
h1{margin:8px 0 0;font:700 clamp(28px,4vw,44px)/1.05 var(--f-display);letter-spacing:.06em;text-transform:uppercase;
  background:linear-gradient(180deg,#fff6dd,var(--gold) 75%);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);margin:8px 0 0;max-width:70ch}
.mastery{min-width:240px}
.mastery .lbl{display:flex;justify-content:space-between;font:500 12px var(--f-data);color:var(--muted);margin-bottom:6px}
.mastery .lbl b{color:var(--gold2);font-weight:500}
.bar{height:6px;background:var(--deep);border:1px solid var(--line)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--gold2));box-shadow:0 0 8px rgba(214,180,106,.5);transition:width .4s}

/* Панель фильтров */
.tools{position:sticky;top:calc(61px + env(safe-area-inset-top,0px));z-index:10;background:var(--void);padding-block:12px;display:grid;grid-template-columns:minmax(200px,1fr) repeat(3,minmax(140px,190px));gap:8px}
.tools.short{grid-template-columns:minmax(200px,1fr)}
.field{border:1px solid var(--line2);background:var(--panel);padding:11px 13px;min-width:0;width:100%;border-radius:0}
.field:focus{outline:none;border-color:var(--energy)}
.info{display:flex;justify-content:space-between;align-items:center;gap:12px;font:500 12px var(--f-data);color:var(--muted);margin:2px 0 12px}
.btn{border:1px solid var(--line2);background:var(--panel);padding:8px 14px;font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase}
.btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold2)}
.btn:disabled{opacity:.4;cursor:default}
.btn.gold{background:linear-gradient(90deg,var(--gold),var(--gold2));border-color:var(--gold);color:#1a1408}
.btn.gold:hover{filter:brightness(1.08);color:#1a1408}
.btn.danger:hover{border-color:var(--warn);color:var(--warn)}

/* Сетка карточек */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.tile{position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 10px 12px;border:1px solid var(--line);
  background:linear-gradient(165deg,var(--panel2),var(--panel) 60%);text-align:center;cursor:pointer;content-visibility:auto;contain-intrinsic-size:auto 196px;transition:border-color .15s,transform .15s}
.tile:hover{border-color:var(--line2);transform:translateY(-2px)}
.tile:hover .pic{filter:drop-shadow(0 0 10px rgba(95,212,232,.35))}
.tile .pic{width:96px;height:96px;object-fit:contain;transition:filter .2s}
.tile .none{width:96px;height:96px;display:grid;place-items:center;font:700 34px var(--f-display);color:var(--gold);opacity:.7}
.tile .nm{font:600 14px/1.25 var(--f-display);letter-spacing:.02em}
.tile .en{font:500 11px var(--f-data);color:var(--muted)}
.tile .tags{display:flex;gap:4px;flex-wrap:wrap;justify-content:center;margin-top:auto}
.tag{font:500 10.5px var(--f-data);padding:1px 6px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.tag.p{color:var(--gold2);border-color:#6f5a33}
.tag.v{color:var(--warn);border-color:#6b4a35}
.tag.ok{color:var(--ok);border-color:#3d6146}
.mk{position:absolute;top:8px;right:8px;width:26px;height:26px;border:1px solid var(--line2);background:var(--deep);display:grid;place-items:center;padding:0}
.mk:before{content:"";width:9px;height:9px;transform:rotate(45deg);border:1px solid var(--muted)}
.mk:hover{border-color:var(--gold)}
.tile.done{border-color:#5d4c2c;background:linear-gradient(165deg,#221d14,var(--panel) 65%)}
.tile.done .mk{border-color:var(--gold);background:rgba(214,180,106,.15)}
.tile.done .mk:before{background:var(--gold);border-color:var(--gold);box-shadow:0 0 8px var(--gold)}
.more{display:flex;justify-content:center;padding:22px}
.empty{padding:50px 16px;text-align:center;color:var(--muted)}

/* Таблицы реликвий и ресурсов */
.rows{display:grid;gap:6px}
.row{display:grid;grid-template-columns:52px minmax(140px,220px) minmax(0,1fr);gap:14px;align-items:start;padding:10px 14px;border:1px solid var(--line);background:var(--panel);content-visibility:auto;contain-intrinsic-size:auto 80px}
.row img{width:52px;height:52px;object-fit:contain}
.row .t{font:600 15px var(--f-display)}
.row .s{font:500 11.5px var(--f-data);color:var(--muted);margin-top:3px}
.row .w{color:#c6d1de;font-size:14px;white-space:pre-line}

/* Панель подробностей */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(3,6,10,.6)}
.drawer{position:fixed;top:0;right:0;bottom:0;z-index:41;width:min(640px,100%);background:#0c1422;border-left:1px solid var(--line2);overflow-y:auto;overscroll-behavior:contain;
  padding:calc(18px + env(safe-area-inset-top,0px)) max(22px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) 22px;animation:slide .22s ease-out}
@keyframes slide{from{transform:translateX(30px);opacity:.4}}
.dhead{display:grid;grid-template-columns:132px minmax(0,1fr);gap:18px;align-items:center;margin-bottom:12px}
.dhead img,.dhead .none{width:132px;height:132px;object-fit:contain;background:radial-gradient(circle at 50% 45%,#22395a,#0b1422 70%);border:1px solid var(--line)}
.dhead .none{display:grid;place-items:center;font:700 44px var(--f-display);color:var(--gold)}
.dhead h2{margin:0;font:700 26px/1.15 var(--f-display);letter-spacing:.03em}
.dhead .en{font:500 12px var(--f-data);color:var(--muted);margin-top:4px}
.dhead .tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:10px}
.close{position:sticky;top:0;float:right;width:38px;height:38px;border:1px solid var(--line2);background:var(--panel);font-size:20px;line-height:1;z-index:2}
.close:hover{border-color:var(--gold)}
.route{color:#cdd6e2;margin:6px 0 4px}
.slabel{font:700 11px var(--f-display);letter-spacing:.24em;text-transform:uppercase;color:var(--gold);margin:22px 0 10px;display:flex;align-items:center;gap:10px}
.slabel:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line2),transparent)}
.part{border-top:1px solid var(--line);padding:11px 0;display:grid;grid-template-columns:minmax(90px,130px) 34px minmax(0,1fr);gap:10px}
.part b{font-weight:600}
.part .q{font-family:var(--f-data);color:var(--gold2)}
.part .w{color:#c6d1de;font-size:14px;white-space:pre-line}
.rel{margin-top:6px;font:500 12px/1.9 var(--f-data);color:var(--muted)}
.rel button,.chip{border:1px solid var(--line2);background:var(--deep);padding:2px 8px;margin:0 4px 4px 0;color:var(--energy);font:500 12px var(--f-data)}
.rel button:hover,.chip:hover{border-color:var(--energy)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:7px;color:#d4e3f1;font:500 13px var(--f-body);padding:5px 10px;margin:0}
.chip img{width:24px;height:24px;object-fit:contain}
.toggle{display:flex;align-items:center;gap:12px;margin-top:18px;padding:12px 14px;border:1px solid var(--line2);background:var(--panel);width:100%;text-align:left;font:600 13px var(--f-display);letter-spacing:.08em;text-transform:uppercase}
.toggle .mk{position:static}
.toggle.on{border-color:var(--gold);color:var(--gold2)}
.toggle.on .mk{border-color:var(--gold);background:rgba(214,180,106,.15)}
.toggle.on .mk:before{background:var(--gold);border-color:var(--gold)}
.src{margin-top:18px;font-size:13px;color:var(--muted)}

/* Хроники */
.lore{position:relative;height:calc(100vh - 61px - env(safe-area-inset-top,0px));min-height:560px;overflow:hidden}
.lore canvas{position:absolute;inset:0;width:100%;height:100%}
.lore .vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 70% 60% at 50% 45%,transparent 30%,rgba(6,10,17,.85) 100%)}
.lore .in{position:relative;height:100%;display:grid;grid-template-rows:1fr auto}
.stage{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,5vw,72px);align-items:center;max-width:1240px;width:100%;margin:auto;min-height:0;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.emblem{position:relative;aspect-ratio:1;max-width:min(100%,420px);max-height:54vh;justify-self:center;width:100%}
.emblem svg{width:100%;height:100%;overflow:visible}
.emblem .halo{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent),transparent 68%);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08);opacity:.7}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s cubic-bezier(.6,.1,.2,1) forwards}
.draw.d2{animation-delay:.35s}.draw.d3{animation-delay:.7s}.draw.d4{animation-delay:1.05s}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{opacity:0;animation:fade 1.2s .9s ease forwards}
@keyframes fade{to{opacity:1}}
.spin{transform-origin:200px 200px;animation:rot 40s linear infinite}
.spinr{transform-origin:200px 200px;animation:rot 70s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}
.ltext{min-width:0;max-height:58vh;overflow:auto;padding-right:6px}
.era{display:inline-flex;align-items:center;gap:10px;font:700 12px var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.era:before{content:"";width:30px;height:1px;background:var(--accent)}
.ltext h2{font:700 clamp(28px,4.2vw,52px)/1.05 var(--f-display);letter-spacing:.04em;margin:12px 0 6px;text-wrap:balance}
.when{font:500 13px var(--f-data);color:var(--muted);margin-bottom:16px}
.ltext p{margin:0 0 13px;max-width:62ch;color:#cfd8e3}
.quest{display:inline-flex;margin-top:4px;padding:6px 13px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);font:600 12px var(--f-display);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.reveal>*{opacity:0;transform:translateY(12px);animation:up .6s ease forwards}
.reveal>*:nth-child(2){animation-delay:.07s}.reveal>*:nth-child(3){animation-delay:.14s}.reveal>*:nth-child(4){animation-delay:.21s}.reveal>*:nth-child(5){animation-delay:.28s}.reveal>*:nth-child(6){animation-delay:.35s}
@keyframes up{to{opacity:1;transform:none}}
.tl{padding-block:10px 18px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tl-in{max-width:1300px;margin:auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:12px;align-items:center}
.arrow{width:44px;height:44px;border:1px solid var(--line2);background:var(--panel);color:var(--gold2);font:600 20px var(--f-display)}
.arrow:hover:not(:disabled){border-color:var(--gold)}
.arrow:disabled{opacity:.3;cursor:default}
.track{overflow-x:auto;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.eras{display:flex;gap:4px;min-width:max-content}
.eg{display:flex;flex-direction:column;gap:7px;padding:0 6px}
.eg span{font:600 10px var(--f-display);letter-spacing:.18em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.eg.cur span{color:var(--ec)}
.dots{display:flex;gap:2px;position:relative}
.dots:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.dot{position:relative;width:30px;height:22px;border:0;background:transparent;padding:0}
.dot:after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;transform:translate(-50%,-50%) rotate(45deg);background:var(--void);border:1px solid var(--ec);transition:all .2s}
.dot:hover:after{background:var(--ec)}
.dot.on:after{width:14px;height:14px;background:var(--ec);box-shadow:0 0 14px var(--ec)}
.lprog{height:2px;background:var(--line);margin:10px auto 0;max-width:1300px}
.lprog i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .5s}
.lhint{text-align:center;font:500 11px var(--f-data);color:var(--muted);margin-top:7px}
.spoil{position:absolute;inset:0;z-index:3;display:grid;place-items:center;background:rgba(6,10,17,.9);padding:16px}
.spoil div{max-width:460px;text-align:center;border:1px solid var(--line2);background:var(--deep);padding:30px}
.spoil h2{font:700 22px var(--f-display);letter-spacing:.08em;color:var(--gold2);margin:0 0 10px;text-transform:uppercase}
.spoil p{color:var(--muted);margin:0 0 20px}

/* Профиль */
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;padding-bottom:40px}
.card{border:1px solid var(--line);background:var(--panel);padding:20px}
.card h3{margin:0 0 12px;font:700 15px var(--f-display);letter-spacing:.16em;text-transform:uppercase;color:var(--gold2)}
.card p{color:var(--muted);margin:0 0 12px;font-size:14px}
.plist{display:grid;gap:6px;margin-bottom:14px}
.pitem{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);background:var(--deep)}
.pitem.cur{border-color:var(--gold)}
.pitem .nm{flex:1;font:600 15px var(--f-display)}
.pitem .n{font:500 12px var(--f-data);color:var(--muted)}
.inline{display:flex;gap:8px;flex-wrap:wrap}
.inline .field{flex:1;min-width:160px}
.stat{display:grid;grid-template-columns:minmax(0,1fr) 90px;gap:4px 12px;align-items:center;margin-bottom:10px;font-size:14px}
.stat .n{font:500 12px var(--f-data);color:var(--muted);text-align:right}
.stat .bar{grid-column:1/-1}
textarea.field{min-height:110px;resize:vertical;font:500 12px var(--f-data)}
ol.steps{margin:0 0 14px;padding-left:20px;color:#c6d1de;font-size:14px}
ol.steps li{margin:6px 0}
code{font:500 12.5px var(--f-data);background:var(--deep);border:1px solid var(--line);padding:1px 5px;word-break:break-all}
.msg{margin-top:10px;font-size:14px}
.msg.ok{color:var(--ok)}.msg.err{color:var(--warn)}
.confirm{margin-top:10px;padding:12px;border:1px solid #6b4a35;background:rgba(232,168,124,.06);font-size:14px}

.guide{max-width:900px;padding-bottom:40px}
.guide .g{border:1px solid var(--line);background:var(--panel);padding:24px}
.guide h2{margin:24px 0 8px;color:var(--gold);font:700 16px var(--f-display);letter-spacing:.12em;text-transform:uppercase}
.guide h2:first-child{margin-top:0}
.guide table{border-collapse:collapse;width:100%;font-size:14px}
.guide td,.guide th{border-bottom:1px solid var(--line);padding:9px;text-align:left;vertical-align:top}
footer{border-top:1px solid var(--line);color:var(--muted);font-size:12px;padding-block:18px 28px;margin-top:20px}
.loading{padding:80px 16px;text-align:center;color:var(--muted);font:500 13px var(--f-data);letter-spacing:.1em}

@media(max-width:860px){
  .tools{grid-template-columns:1fr 1fr}.tools .q{grid-column:1/-1}
  .grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
  .tile .pic,.tile .none{width:76px;height:76px}
  .row{grid-template-columns:44px minmax(0,1fr)}.row img{width:44px;height:44px}.row .w{grid-column:1/-1}
  .cols{grid-template-columns:1fr}
  .stage{grid-template-columns:1fr;gap:8px}.emblem{max-width:200px}.ltext{max-height:none}
  .lore{height:auto;min-height:calc(100vh - 61px)}
  .logo span{display:none}
  .part{grid-template-columns:1fr 40px}.part .w{grid-column:1/-1}
  .dhead{grid-template-columns:96px minmax(0,1fr)}.dhead img,.dhead .none{width:96px;height:96px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.fadein,.reveal>*{opacity:1;transform:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <a class="logo" href="#arsenal" aria-label="Warframe Arsenal — на главную">
    <svg viewBox="0 0 40 40" fill="none" stroke="#d6b46a" stroke-width="1.5" aria-hidden="true"><path d="M20 3 L36 20 L20 37 L4 20 Z"/><path d="M20 10 L29 20 L20 30 L11 20 Z" opacity=".6"/><circle cx="20" cy="20" r="3" fill="#5fd4e8" stroke="none"/></svg>
    <span>Arsenal</span></a>
  <nav class="tabs" id="tabs">
    <a href="#arsenal" data-v="arsenal">Оружие</a><a href="#frames" data-v="frames">Варфреймы</a><a href="#relics" data-v="relics">Реликвии</a>
    <a href="#resources" data-v="resources">Ресурсы</a><a href="#new" data-v="new">Новое</a><a href="#lore" data-v="lore">Хроники</a><a href="#guide" data-v="guide">Справка</a>
  </nav>
  <a class="who" href="#profile" id="who"><i></i><span id="whoName">Профиль</span></a>
</div></header>

<main id="view"><div class="loading">ЗАГРУЗКА АРСЕНАЛА…</div></main>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden role="dialog" aria-modal="true" aria-label="Подробности"></aside>

<script src="lore.js"></script>
<script>
(()=>{
'use strict';
const $=s=>document.querySelector(s), view=$('#view');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const IMG=n=>n?'img/'+n:'';
const pic=(n,cls,alt,size)=>n?`<img class="${cls||''}" src="${IMG(n)}" alt="${esc(alt||'')}" loading="lazy" decoding="async" width="${size||96}" height="${size||96}">`:'';
const num=n=>Number(n).toLocaleString('ru');
let D=null;

/* ---------- Профили (хранятся в этом браузере) ---------- */
const KEY='wa:v1';
let S=load();
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.profiles)return s}catch(_){}return{cur:null,profiles:{}}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(_){}renderWho()}
const prof=()=>S.profiles[S.cur]||null;
function newProfile(name){const id='p'+Date.now().toString(36);S.profiles[id]={name:name||'Тэнно',m:{},pid:'',created:Date.now()};S.cur=id;save();return id}
const mkey=(kind,it)=>(kind==='frames'?'f:':'w:')+it.name;
const isDone=(kind,it)=>{const p=prof();return !!(p&&p.m[mkey(kind,it)])};
function setDone(kind,it,v){let p=prof();if(!p){newProfile('Тэнно');p=prof()}const k=mkey(kind,it);if(v)p.m[k]=1;else delete p.m[k];save()}
function renderWho(){const p=prof();$('#whoName').textContent=p?p.name:'Профиль'}

/* ---------- Данные ---------- */
const KINDS=[['','Все варианты'],['prime','Prime'],['kuva','Кува'],['tenet','Тенет'],['coda','Кода'],['incarnon','Инкарнон'],['unavailable','Сейчас недоступно']];
function prep(){
  for(const k of ['weapons','frames']) for(const it of D[k]){
    it._s=(it.ru+' '+it.name+' '+it.category+' '+it.method+' '+it.parts.map(p=>p.name+' '+p.where+' '+p.relics).join(' ')+' '+it.materials.map(m=>m.name+' '+m.en).join(' ')).toLowerCase();
    it._un=/Сейчас получить нельзя|новым игрокам недоступен|получить нельзя/.test(it.method);
  }
  for(const k of ['relics','resources']) for(const it of D[k]) it._s=(it.name+' '+(it.ru||'')+' '+(it.status||'')+' '+it.where).toLowerCase();
  D.byUid={};for(const it of D.weapons)if(it.uid)D.byUid[it.uid]=['arsenal',it];for(const it of D.frames)if(it.uid)D.byUid[it.uid]=['frames',it];
  D.matImg={};for(const k of ['weapons','frames'])for(const it of D[k])for(const m of it.materials)if(m.img)D.matImg[m.en||m.name]=m.img;
  D.resByEn={};for(const r of D.resources)D.resByEn[r.name.toLowerCase()]=r;
}
const match=(s,q)=>q.split(/\s+/).filter(Boolean).every(t=>s.includes(t));

/* ---------- Маршрутизация ---------- */
const state={arsenal:{q:'',cat:'',kind:'',done:'',sort:'name'},frames:{q:'',cat:'',kind:'',done:'',sort:'name'},relics:{q:''},resources:{q:''}};
let cur='',loreTimer=null;
function route(){
  const h=location.hash.slice(1)||'arsenal';const m=h.match(/^lore-(\d+)$/);const v=m?'lore':h;
  const known=['arsenal','frames','relics','resources','new','lore','guide','profile'];
  const vv=known.includes(v)?v:'arsenal';
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.v===vv));
  closeDrawer(true);
  if(cur==='lore'&&vv!=='lore')stopLore();
  if(vv==='lore'&&cur==='lore'&&m){showEv(+m[1]-1,true);return}
  cur=vv;window.scrollTo(0,0);
  ({arsenal:()=>catalog('arsenal'),frames:()=>catalog('frames'),relics:()=>table('relics'),resources:()=>table('resources'),new:fresh,lore:()=>lore(m?+m[1]-1:0),guide,profile})[vv]();
}
addEventListener('hashchange',route);

/* ---------- Каталог: оружие и варфреймы ---------- */
const BATCH=60;
function catalog(kind){
  const st=state[kind],list=kind==='frames'?D.frames:D.weapons;
  const cats=kind==='frames'?['Варфреймы','Некрамехи']:D.cats;
  view.innerHTML=`<div class="wrap">
   <div class="head"><div><div class="eyebrow">${kind==='frames'?'Оболочки Тэнно':'Арсенал Тэнно'}</div><h1>${kind==='frames'?'Варфреймы':'Оружие'}</h1>
     <p class="sub">${kind==='frames'?'Варфреймы и некрамехи: чертежи, детали, реликвии и материалы.':'Основное, вторичное, ближний бой, арч-оружие, Зо, китганы, усилители и Рэйлджек.'} Нажмите на карточку, чтобы открыть подробности, или на ромб, чтобы отметить освоенное.</p></div>
     <div class="mastery" id="mst"></div></div>
   <div class="tools">
     <input class="field q" id="q" type="search" placeholder="Название, деталь, планета, реликвия…" aria-label="Поиск" value="${esc(st.q)}">
     <select class="field" id="cat" aria-label="Категория"><option value="">Все категории</option>${cats.map(c=>`<option ${st.cat===c?'selected':''}>${esc(c)}</option>`).join('')}</select>
     <select class="field" id="kind" aria-label="Вариант">${KINDS.map(([v,t])=>`<option value="${v}" ${st.kind===v?'selected':''}>${t}</option>`).join('')}</select>
     <select class="field" id="done" aria-label="Освоение"><option value="">Освоено и нет</option><option value="no" ${st.done==='no'?'selected':''}>Ещё не освоено</option><option value="yes" ${st.done==='yes'?'selected':''}>Освоено</option></select>
   </div>
   <div class="info"><span id="cnt"></span><span class="inline"><select class="field" id="sort" aria-label="Сортировка" style="padding:6px 10px;width:auto"><option value="name">По имени</option><option value="mr" ${st.sort==='mr'?'selected':''}>По рангу мастерства</option></select><button class="btn" id="reset">Сбросить</button></span></div>
   <div class="grid" id="grid"></div><div class="more" id="more"></div></div>${foot()}`;
  let arr=[],shown=0;
  const apply=()=>{
    const q=st.q.toLowerCase().trim();
    arr=list.filter(it=>(!q||match(it._s,q))&&(!st.cat||it.category===st.cat)&&
      (!st.kind||(st.kind==='unavailable'?it._un:it.name.toLowerCase().includes(st.kind)))&&
      (!st.done||(st.done==='yes')===isDone(kind,it)));
    arr.sort(st.sort==='mr'?(a,b)=>(a.mr??99)-(b.mr??99)||a.ru.localeCompare(b.ru,'ru'):(a,b)=>a.ru.localeCompare(b.ru,'ru'));
    $('#cnt').textContent=`Найдено: ${num(arr.length)}`;
    $('#grid').innerHTML='';shown=0;more();mastery(kind);
  };
  const more=()=>{
    const slice=arr.slice(shown,shown+BATCH);shown+=slice.length;
    $('#grid').insertAdjacentHTML('beforeend',slice.length?slice.map((it,i)=>tile(kind,it,shown-slice.length+i)).join(''):(shown?'':'<div class="empty" style="grid-column:1/-1">Ничего не найдено. Попробуйте английское название или снимите фильтры.</div>'));
    $('#more').innerHTML=shown<arr.length?`<button class="btn" id="mbtn">Показать ещё (${num(arr.length-shown)})</button>`:'';
    if(shown<arr.length)io.observe($('#mbtn'));
  };
  const io=new IntersectionObserver(es=>{if(es.some(e=>e.isIntersecting)){io.disconnect();more()}},{rootMargin:'600px'});
  let t;$('#q').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{st.q=e.target.value;apply()},140)});
  for(const id of ['cat','kind','done','sort'])$('#'+id).addEventListener('change',e=>{st[id]=e.target.value;apply()});
  $('#reset').onclick=()=>{Object.assign(st,{q:'',cat:'',kind:'',done:'',sort:'name'});catalog(kind)};
  $('#more').addEventListener('click',e=>{if(e.target.id==='mbtn'){io.disconnect();more()}});
  $('#grid').addEventListener('click',e=>{
    const t=e.target.closest('.tile');if(!t)return;const it=arr[+t.dataset.i];
    if(e.target.closest('.mk')){const v=!isDone(kind,it);setDone(kind,it,v);t.classList.toggle('done',v);t.querySelector('.mk').setAttribute('aria-pressed',v);mastery(kind);return}
    openItem(kind,it,()=>{t.classList.toggle('done',isDone(kind,it));mastery(kind)});
  });
  $('#grid').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('tile'))e.target.click()});
  apply();
}
function tile(kind,it,i){
  const d=isDone(kind,it);
  return `<div class="tile cut${d?' done':''}" data-i="${i}" tabindex="0" role="button" aria-label="${esc(it.ru)}">
   <button class="mk" aria-label="Отметить освоенным" aria-pressed="${d}" title="Освоено"></button>
   ${it.img?pic(it.img,'pic',it.name):`<div class="none">${esc(it.name[0])}</div>`}
   <div class="nm">${esc(it.ru)}</div><div class="en">${esc(it.name)}</div>
   <div class="tags">${it.mr!=null?`<span class="tag">РМ ${it.mr}</span>`:''}${/Prime/.test(it.name)?'<span class="tag p">PRIME</span>':''}${it.vaulted?'<span class="tag v">Хранилище</span>':''}${it._un?'<span class="tag v">Недоступно</span>':''}</div></div>`;
}
function mastery(kind){
  const el=$('#mst');if(!el)return;const list=kind==='frames'?D.frames:D.weapons;const p=prof();
  const n=p?list.filter(it=>p.m[mkey(kind,it)]).length:0;
  el.innerHTML=`<div class="lbl"><span>${p?esc(p.name):'Без профиля'} · освоено</span><b>${n} / ${list.length}</b></div><div class="bar"><i style="width:${(n/list.length*100).toFixed(1)}%"></i></div>`;
}

/* ---------- Подробности ---------- */
let onClose=null;
function openItem(kind,it,cb){
  onClose=cb||null;
  const relhtml=s=>esc(s).replace(/\b(?:Lith|Meso|Neo|Axi|Requiem|Vanguard) [A-Z]\d+\b/g,n=>`<button data-rel="${n}">${n}</button>`);
  const d=$('#drawer');
  d.innerHTML=`<button class="close" id="dclose" aria-label="Закрыть">×</button>
   <div class="dhead">${it.img?pic(it.img,'',it.name,132):`<div class="none">${esc(it.name[0])}</div>`}
    <div><h2>${esc(it.ru)}</h2><div class="en">${esc(it.name)} · ${esc(it.category)}</div>
    <div class="tags">${it.mr!=null?`<span class="tag">РМ ${it.mr}</span>`:''}${/Prime/.test(it.name)?'<span class="tag p">PRIME</span>':''}${it.vaulted?'<span class="tag v">В хранилище</span>':''}${it.cap>30?`<span class="tag">Ранг до ${it.cap}</span>`:''}</div></div></div>
   <p class="route">${esc(it.method)}</p>
   <button class="toggle${isDone(kind,it)?' on':''}" id="dtog"><span class="mk"></span><span id="dtogt">${isDone(kind,it)?'Освоено':'Отметить освоенным'}</span></button>
   <div class="slabel">Состав и получение</div>
   ${it.parts.map(p=>`<div class="part"><b>${esc(p.name)}</b><span class="q">×${p.qty}</span><div class="w">${esc(p.where)}${p.relics?`<div class="rel">${relhtml(p.relics)}</div>`:''}</div></div>`).join('')||'<p class="route">Отдельных деталей нет.</p>'}
   ${it.materials.length?`<div class="slabel">Материалы рецепта</div><div class="chips">${it.materials.map(m=>`<button class="chip" data-res="${esc(m.en||m.name)}">${pic(m.img||D.matImg[m.en||m.name],'',m.name,24)}${esc(m.name)} × ${num(m.qty)}</button>`).join('')}</div>`:''}
   <div class="src">Источник: <a href="${esc(it.source)}" target="_blank" rel="noopener">WARFRAME Wiki — ${esc(it.name)}</a>; состав и реликвии — WFCD.</div>`;
  $('#scrim').hidden=false;d.hidden=false;d.scrollTop=0;$('#dclose').focus();
  $('#dtog').onclick=()=>{const v=!isDone(kind,it);setDone(kind,it,v);$('#dtog').classList.toggle('on',v);$('#dtogt').textContent=v?'Освоено':'Отметить освоенным'};
  d.onclick=e=>{const r=e.target.closest('[data-rel]'),m=e.target.closest('[data-res]');
    if(r){state.relics.q=r.dataset.rel;location.hash='relics'}
    if(m){const res=D.resByEn[m.dataset.res.toLowerCase()];state.resources.q=res?res.ru:m.dataset.res;location.hash='resources'}};
}
function closeDrawer(silent){const d=$('#drawer');if(d.hidden)return;d.hidden=true;$('#scrim').hidden=true;if(onClose)onClose();onClose=null}
$('#scrim').onclick=()=>closeDrawer();
document.addEventListener('click',e=>{if(e.target.id==='dclose')closeDrawer()});
addEventListener('keydown',e=>{if(e.key==='Escape')closeDrawer()});

/* ---------- Реликвии и ресурсы ---------- */
function table(kind){
  const st=state[kind],list=D[kind];
  view.innerHTML=`<div class="wrap"><div class="head"><div><div class="eyebrow">${kind==='relics'?'Реликвии Бездны':'Материалы'}</div><h1>${kind==='relics'?'Реликвии':'Ресурсы'}</h1>
   <p class="sub">${kind==='relics'?'Где взять каждую реликвию и выпадает ли она сейчас. Статус обновляется автоматически каждую неделю.':'Где добывать ресурсы для рецептов.'}</p></div></div>
   <div class="tools short"><input class="field q" id="q" type="search" placeholder="${kind==='relics'?'Например, Axi A1 или Lith':'Название ресурса или планета'}" aria-label="Поиск" value="${esc(st.q)}"></div>
   <div class="info"><span id="cnt"></span></div><div class="rows" id="rows"></div><div class="more" id="more"></div></div>${foot()}`;
  let arr=[],shown=0;
  const row=it=>kind==='relics'
    ?`<div class="row cut">${pic(it.img,'',it.name,52)||'<span></span>'}<div><div class="t">${esc(it.name)}</div><div class="s">${esc(it.status)}</div>${it.vaulted!=null?`<span class="tag ${it.vaulted?'v':'ok'}" style="display:inline-block;margin-top:6px">${it.vaulted?'Сейчас в хранилище':'Сейчас выпадает'}</span>`:''}</div><div class="w">${esc(it.where)}</div></div>`
    :`<div class="row cut">${pic(it.img,'',it.name,52)||'<span></span>'}<div><div class="t">${esc(it.ru)}</div><div class="s">${esc(it.name)}</div></div><div class="w">${esc(it.where)}</div></div>`;
  const more=()=>{const s=arr.slice(shown,shown+80);shown+=s.length;$('#rows').insertAdjacentHTML('beforeend',s.map(row).join('')||(shown?'':'<div class="empty">Ничего не найдено.</div>'));
    $('#more').innerHTML=shown<arr.length?`<button class="btn" id="mbtn">Показать ещё (${num(arr.length-shown)})</button>`:''};
  const apply=()=>{const q=st.q.toLowerCase().trim();arr=list.filter(it=>!q||match(it._s,q));$('#cnt').textContent=`Найдено: ${num(arr.length)}`;$('#rows').innerHTML='';shown=0;more()};
  let t;$('#q').addEventListener('input',e=>{clearTimeout(t);t=setTimeout(()=>{st.q=e.target.value;apply()},140)});
  $('#more').onclick=e=>{if(e.target.id==='mbtn')more()};
  apply();
}

/* ---------- Новое в игре ---------- */
function fresh(){
  view.innerHTML=`<div class="wrap"><div class="head"><div><div class="eyebrow">Автообновление</div><h1>Новое в игре</h1>
   <p class="sub">Оружие, которое появилось в базе игры, но ещё не описано в каталоге. Список обновляется каждую неделю, подробности — на вики.</p></div></div>
   <div class="grid" style="margin-top:14px">${D.fresh.length?D.fresh.map(f=>`<a class="tile cut" style="text-decoration:none;color:inherit" href="${esc(f.wiki||'https://wiki.warframe.com/w/'+encodeURIComponent(f.name.replace(/ /g,'_')))}" target="_blank" rel="noopener">${pic(f.img,'pic',f.name)}<div class="nm">${esc(f.ru)}</div><div class="en">${esc(f.name)}</div><div class="tags"><span class="tag">${esc(f.type)}</span>${f.mr!=null?`<span class="tag">РМ ${f.mr}</span>`:''}<span class="tag">${esc(f.date)}</span></div></a>`).join(''):'<div class="empty" style="grid-column:1/-1">Новых предметов нет — каталог актуален.</div>'}</div></div>${foot()}`;
}

/* ---------- Справка ---------- */
function guide(){view.innerHTML=`<div class="wrap guide"><div class="head"><div><div class="eyebrow">Справка</div><h1>Как пользоваться</h1></div></div><div class="g cut">${D.guide}</div></div>${foot()}`}

/* ---------- Профиль и освоение ---------- */
function profile(){
  const p=prof();
  const stat=(label,list,kind)=>{const n=p?list.filter(it=>p.m[mkey(kind,it)]).length:0;return `<div class="stat"><span>${esc(label)}</span><span class="n">${n} / ${list.length}</span><div class="bar"><i style="width:${list.length?(n/list.length*100).toFixed(1):0}%"></i></div></div>`};
  const byCat={};for(const w of D.weapons)(byCat[w.category]=byCat[w.category]||[]).push(w);
  view.innerHTML=`<div class="wrap"><div class="head"><div><div class="eyebrow">Тэнно</div><h1>Профиль</h1>
   <p class="sub">Профили хранятся в этом браузере. Создайте отдельный профиль для каждого игрока на этом устройстве, а чтобы перенести прогресс на другое устройство, используйте код профиля.</p></div></div>
   <div class="cols">
    <section class="card cut"><h3>Профили</h3>
      <div class="plist">${Object.entries(S.profiles).map(([id,x])=>`<div class="pitem${id===S.cur?' cur':''}"><span class="nm">${esc(x.name)}</span><span class="n">${Object.keys(x.m).length} освоено</span>${id===S.cur?'<span class="tag p">Активен</span>':`<button class="btn" data-use="${id}">Выбрать</button>`}</div>`).join('')||'<p>Профилей пока нет — создайте первый.</p>'}</div>
      <form class="inline" id="pnew"><input class="field" id="pname" maxlength="40" placeholder="Имя нового профиля" aria-label="Имя нового профиля" required><button class="btn gold" type="submit">Создать</button></form>
      ${p?`<div class="inline" style="margin-top:10px"><input class="field" id="prn" maxlength="40" value="${esc(p.name)}" aria-label="Имя профиля"><button class="btn" id="prename">Переименовать</button><button class="btn danger" id="pdel">Удалить</button></div><div id="pconf"></div>`:''}
    </section>
    <section class="card cut"><h3>Освоение${p?' — '+esc(p.name):''}</h3>
      ${stat('Варфреймы и некрамехи',D.frames,'frames')}${stat('Всё оружие',D.weapons,'arsenal')}
      ${Object.keys(byCat).sort((a,b)=>byCat[b].length-byCat[a].length).map(c=>stat(c,byCat[c],'arsenal')).join('')}
    </section>
    <section class="card cut"><h3>Синхронизация с игрой</h3>
      <p>У Warframe есть открытая страница профиля игрока с опытом каждого предмета. Сайт может отметить всё, что прокачано до максимального ранга. Браузер не даёт сайту запросить её сам, поэтому нужен один шаг вручную.</p>
      <ol class="steps">
       <li>Найдите ID аккаунта: откройте файл <code>%LOCALAPPDATA%\\Warframe\\EE.log</code> (после запуска игры) и найдите строку <code>Logged in</code> — в скобках 24 символа, это ваш ID. Можно вставить сюда всю строку.</li>
       <li>Вставьте ID и откройте ссылку на профиль.</li>
       <li>Скопируйте всё, что откроется на странице (Ctrl+A, Ctrl+C), и вставьте в поле ниже.</li>
      </ol>
      <div class="inline"><input class="field" id="pid" placeholder="ID аккаунта или строка из EE.log" aria-label="ID аккаунта" value="${esc(p?p.pid:'')}"><a class="btn" id="popen" target="_blank" rel="noopener" href="#">Открыть профиль</a></div>
      <textarea class="field" id="pjson" style="margin-top:8px" placeholder="Сюда вставьте ответ страницы профиля" aria-label="Данные профиля"></textarea>
      <div class="inline" style="margin-top:8px"><button class="btn gold" id="pimp">Импортировать освоение</button></div><div id="pmsg" class="msg"></div>
    </section>
    <section class="card cut"><h3>Перенос между устройствами</h3>
      <p>Скопируйте код профиля и вставьте его на другом устройстве, чтобы перенести отметки.</p>
      <div class="inline"><button class="btn" id="pexp" ${p?'':'disabled'}>Скопировать код профиля</button></div>
      <textarea class="field" id="pcode" style="margin-top:8px" placeholder="Код профиля появится здесь, или вставьте сюда чужой код" aria-label="Код профиля"></textarea>
      <div class="inline" style="margin-top:8px"><button class="btn" id="pin">Загрузить из кода</button></div><div id="pmsg2" class="msg"></div>
    </section>
   </div></div>${foot()}`;
  view.querySelectorAll('[data-use]').forEach(b=>b.onclick=()=>{S.cur=b.dataset.use;save();profile()});
  $('#pnew').onsubmit=e=>{e.preventDefault();newProfile($('#pname').value.trim());profile()};
  if(p){
    $('#prename').onclick=()=>{p.name=$('#prn').value.trim()||p.name;save();profile()};
    $('#pdel').onclick=()=>{$('#pconf').innerHTML=`<div class="confirm">Удалить профиль «${esc(p.name)}» и все его отметки? Отменить это нельзя. <div class="inline" style="margin-top:8px"><button class="btn danger" id="pdel2">Да, удалить</button><button class="btn" id="pdelno">Отмена</button></div></div>`;
      $('#pdel2').onclick=()=>{delete S.profiles[S.cur];S.cur=Object.keys(S.profiles)[0]||null;save();profile()};$('#pdelno').onclick=()=>{$('#pconf').innerHTML=''}};
  }
  const pidOf=()=>{const m=$('#pid').value.match(/[0-9a-f]{24}/i);return m?m[0].toLowerCase():''};
  const upd=()=>{const id=pidOf();$('#popen').href=id?'https://api.warframe.com/cdn/getProfileViewingData.php?playerId='+id:'#'};
  $('#pid').addEventListener('input',upd);upd();
  $('#popen').onclick=e=>{if(!pidOf()){e.preventDefault();msg('#pmsg','Сначала вставьте ID аккаунта (24 символа).',1)}};
  $('#pimp').onclick=()=>{
    let j;try{j=JSON.parse($('#pjson').value)}catch(_){return msg('#pmsg','Не получилось прочитать данные. Скопируйте страницу профиля целиком, начиная с фигурной скобки.',1)}
    const xp=[];let name='';(function walk(o){if(Array.isArray(o)){for(const x of o){if(x&&typeof x==='object'&&'ItemType' in x&&'XP' in x)xp.push(x);else walk(x)}}else if(o&&typeof o==='object'){if(typeof o.DisplayName==='string'&&!name)name=o.DisplayName;for(const k in o)walk(o[k])}})(j);
    if(!xp.length)return msg('#pmsg','В данных нет списка опыта предметов. Проверьте, что скопирована страница профиля.',1);
    if(!prof())newProfile(name?name.replace(/[^\w\-. ]/g,'').trim()||'Тэнно':'Тэнно');
    const pp=prof();if(pidOf())pp.pid=pidOf();let n=0,seen=0;
    for(const x of xp){const hit=D.byUid[x.ItemType];if(!hit)continue;seen++;const [kind,it]=hit;const need=(it.xpk||500)*Math.pow(it.cap||30,2);if(x.XP>=need&&!pp.m[mkey(kind,it)]){pp.m[mkey(kind,it)]=1;n++}}
    save();msg('#pmsg',`Готово: найдено ${seen} предметов каталога с опытом, отмечено новых освоенных: ${n}.`);setTimeout(profile,1600);
  };
  if(p)$('#pexp').onclick=()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify({n:p.name,m:Object.keys(p.m)}))));$('#pcode').value=code;
    navigator.clipboard?.writeText(code).then(()=>msg('#pmsg2','Код скопирован.'),()=>{$('#pcode').select();msg('#pmsg2','Код выделен — скопируйте его.')})};
  $('#pin').onclick=()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('#pcode').value.trim()))));const id=newProfile(String(o.n||'Тэнно').slice(0,40));for(const k of o.m||[])S.profiles[id].m[k]=1;save();profile()}catch(_){msg('#pmsg2','Код не распознан. Скопируйте его целиком.',1)}};
}
function msg(sel,t,err){const el=$(sel);if(!el)return;el.className='msg '+(err?'err':'ok');el.textContent=t}

/* ---------- Хроники ---------- */
const L=window.LORE;let li=0,lcv=null,lraf=0;
function lore(start){
  let ok=false;try{ok=!!sessionStorage.getItem('lore-ok')}catch(_){}
  view.innerHTML=`<section class="lore" id="lore"><canvas id="lcv" aria-hidden="true"></canvas><div class="vig"></div>
   <div class="in"><div class="stage" id="stage" aria-live="polite"></div>
    <div class="tl"><div class="tl-in"><button class="arrow" id="lprev" aria-label="Предыдущее событие">‹</button>
     <div class="track" id="ltrack"><div class="eras">${L.ERAS.map(er=>`<div class="eg" data-era="${er.id}" style="--ec:${er.col}"><span>${er.name}</span><div class="dots">${L.EV.map((e,i)=>e.era===er.id?`<button class="dot" data-i="${i}" aria-label="${esc(e.title)}" title="${esc(e.title)}"></button>`:'').join('')}</div></div>`).join('')}</div></div>
     <button class="arrow" id="lnext" aria-label="Следующее событие">›</button></div>
     <div class="lprog"><i id="lbar"></i></div><div class="lhint">${L.EV.length} событий · ← → на клавиатуре, свайп или колесо мыши</div></div></div>
   ${ok?'':`<div class="spoil" id="spoil"><div><h2>Осторожно, спойлеры</h2><p>Здесь кратко пересказан весь сюжет Warframe, включая квесты «Второй сон», «Новая война», «Старый мир» и «Пролог к Тау». Если ещё не прошли их, лучше сначала пройти.</p><button class="btn gold" id="lok">Всё равно смотреть</button></div></div>`}</section>`;
  if(!ok)$('#lok').onclick=()=>{$('#spoil').remove();try{sessionStorage.setItem('lore-ok','1')}catch(_){}};
  $('#ltrack').onclick=e=>{const b=e.target.closest('.dot');if(b)showEv(+b.dataset.i)};
  $('#lprev').onclick=()=>showEv(li-1);$('#lnext').onclick=()=>showEv(li+1);
  const lv=$('#lore');let wl=0,tx=null;
  lv.addEventListener('wheel',e=>{if(innerWidth<=860||e.target.closest('.ltext'))return;const n=Date.now();if(n-wl<700||Math.abs(e.deltaY)+Math.abs(e.deltaX)<20)return;wl=n;e.preventDefault();showEv(li+((e.deltaY||e.deltaX)>0?1:-1))},{passive:false});
  lv.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
  lv.addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)showEv(li+(dx<0?1:-1));tx=null},{passive:true});
  startCanvas();showEv(start||0,true);
}
function showEv(i,noHash){
  if(!$('#stage'))return;
  li=Math.max(0,Math.min(L.EV.length-1,i));const e=L.EV[li],er=L.ERAS.find(x=>x.id===e.era);
  document.documentElement.style.setProperty('--accent',er.col);lcol=er.bg;
  $('#stage').innerHTML=`<div class="emblem" style="color:${er.col}"><div class="halo"></div><svg viewBox="0 0 400 400" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${L.EM[e.em]||L.EM.wake}</svg></div>
   <div class="ltext reveal"><div class="era">${er.name}</div><h2>${esc(e.title)}</h2><div class="when">${esc(e.when)}</div>${e.p.map(t=>`<p>${esc(t)}</p>`).join('')}${e.quest?`<div><span class="quest cut">Квест: ${esc(e.quest)}</span></div>`:''}</div>`;
  document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',+d.dataset.i===li));
  document.querySelectorAll('.eg').forEach(g=>g.classList.toggle('cur',g.dataset.era===e.era));
  const on=document.querySelector('.dot.on');if(on)on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  $('#lprev').disabled=li===0;$('#lnext').disabled=li===L.EV.length-1;
  $('#lbar').style.width=((li+1)/L.EV.length*100)+'%';
  const h='#lore-'+(li+1);if(!noHash&&location.hash!==h)history.replaceState(null,'',h);
}
addEventListener('keydown',e=>{if(cur!=='lore'||!$('#stage')||e.target.closest('input,textarea,select'))return;if(e.key==='ArrowRight')showEv(li+1);if(e.key==='ArrowLeft')showEv(li-1)});
let lcol=[214,180,106],lc=[214,180,106];
function startCanvas(){
  const cv=$('#lcv');if(!cv)return;const cx=cv.getContext('2d');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  let W,H,P;const size=()=>{const d=Math.min(devicePixelRatio||1,1.5);W=cv.width=cv.clientWidth*d;H=cv.height=cv.clientHeight*d;
    P=Array.from({length:Math.min(140,Math.round(cv.clientWidth*cv.clientHeight/11000))},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.5+.4)*d,v:Math.random()*.25+.05,a:Math.random()*6.3,t:Math.random()*6}))};
  size();const ro=new ResizeObserver(size);ro.observe(cv);let tick=0;
  const frame=()=>{if(!document.body.contains(cv)){ro.disconnect();return}tick++;lc=lc.map((c,i)=>c+(lcol[i]-c)*.04);const rgb=lc.map(Math.round).join(',');
    cx.clearRect(0,0,W,H);const g=cx.createRadialGradient(W*.32,H*.45,0,W*.32,H*.45,Math.max(W,H)*.6);g.addColorStop(0,`rgba(${rgb},.15)`);g.addColorStop(1,'rgba(6,10,17,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);
    for(const p of P){p.a+=.003;p.x+=Math.cos(p.a)*p.v;p.y-=p.v;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}
      cx.fillStyle=`rgba(${rgb},${(.3+.6*Math.abs(Math.sin(tick*.01+p.t))).toFixed(2)})`;cx.fillRect(p.x,p.y,p.r,p.r)}
    if(!reduce&&!document.hidden)lraf=requestAnimationFrame(frame);else lraf=0};
  cancelAnimationFrame(lraf);frame();
  document.addEventListener('visibilitychange',()=>{if(!document.hidden&&cur==='lore'&&!lraf&&!reduce)frame()});
}
function stopLore(){cancelAnimationFrame(lraf);lraf=0}

function foot(){return `<footer class="wrap">Обновлено: ${D.built}. Данные: WARFRAME Wiki и WFCD warframe-items; описания добычи переведены и дополнены вручную. Warframe © Digital Extremes. Неофициальный фанатский сайт.</footer>`}

/* ---------- Запуск ---------- */
fetch('data.json').then(r=>r.json()).then(j=>{D=j;prep();renderWho();route()}).catch(()=>{view.innerHTML='<div class="loading">Не удалось загрузить данные. Обновите страницу.</div>'});
})();
</script>

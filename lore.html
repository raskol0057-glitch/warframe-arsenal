<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Хроники Истоков</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jura:wght@500;600;700&family=Exo+2:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: полноэкранная «сцена» — эмблема события слева, текст справа, шкала эпох внизу; фон-частицы меняют цвет по эпохе */
:root{
  --void:#05080e; --panel:rgba(14,22,36,.72); --line:#26364d; --ink:#e8edf4; --muted:#93a3b8;
  --gold:#d6b46a; --gold2:#f1d89a; --accent:#d6b46a;
  --f-display:'Jura','Exo 2',system-ui,sans-serif; --f-body:'Exo 2',system-ui,'Segoe UI',sans-serif; --f-data:'JetBrains Mono',ui-monospace,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--void);color:var(--ink);font:16px/1.65 var(--f-body);overflow:hidden}
canvas#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.vignette{position:fixed;inset:0;z-index:1;pointer-events:none;background:radial-gradient(ellipse 70% 60% at 50% 45%,transparent 30%,rgba(5,8,14,.85) 100%)}
.app{position:relative;z-index:2;height:100%;display:grid;grid-template-rows:auto 1fr auto;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top a{color:var(--muted);text-decoration:none;font:600 12px var(--f-display);letter-spacing:.2em;text-transform:uppercase}
.top a:hover{color:var(--gold2)}
.brand{font:700 13px var(--f-display);letter-spacing:.32em;text-transform:uppercase;color:var(--gold)}
.counter{font:500 12px var(--f-data);color:var(--muted)}

.stage{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:clamp(20px,5vw,72px);align-items:center;max-width:1240px;width:100%;margin:auto;min-height:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.emblem{position:relative;aspect-ratio:1;max-width:min(100%,440px);max-height:58vh;justify-self:center;width:100%}
.emblem svg{width:100%;height:100%;overflow:visible}
.emblem .halo{position:absolute;inset:8%;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--accent) 22%,transparent) 0%,transparent 68%);filter:blur(8px);animation:breathe 6s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(1.08);opacity:.7}}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.8s cubic-bezier(.6,.1,.2,1) forwards}
.draw.d2{animation-delay:.35s}.draw.d3{animation-delay:.7s}.draw.d4{animation-delay:1.05s}
@keyframes draw{to{stroke-dashoffset:0}}
.fadein{opacity:0;animation:fade 1.2s .9s ease forwards}
@keyframes fade{to{opacity:1}}
.spin{transform-origin:200px 200px;animation:rot 40s linear infinite}
.spinr{transform-origin:200px 200px;animation:rot 70s linear infinite reverse}
@keyframes rot{to{transform:rotate(360deg)}}

.text{min-width:0;max-height:62vh;overflow:auto;padding-right:6px}
.era{display:inline-flex;align-items:center;gap:10px;font:700 12px var(--f-display);letter-spacing:.3em;text-transform:uppercase;color:var(--accent)}
.era:before{content:"";width:30px;height:1px;background:var(--accent)}
h1{font:700 clamp(30px,4.6vw,56px)/1.05 var(--f-display);letter-spacing:.04em;margin:14px 0 6px;text-wrap:balance}
.when{font:500 13px var(--f-data);color:var(--muted);margin-bottom:18px}
.text p{margin:0 0 14px;max-width:62ch;color:#cfd8e3}
.quest{display:inline-flex;gap:8px;align-items:center;margin-top:6px;padding:7px 14px;border:1px solid color-mix(in srgb,var(--accent) 45%,transparent);font:600 12px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--accent);
  clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)}
.reveal>*{opacity:0;transform:translateY(14px);animation:up .7s ease forwards}
.reveal>*:nth-child(2){animation-delay:.08s}.reveal>*:nth-child(3){animation-delay:.16s}.reveal>*:nth-child(4){animation-delay:.24s}.reveal>*:nth-child(5){animation-delay:.32s}.reveal>*:nth-child(6){animation-delay:.4s}.reveal>*:nth-child(7){animation-delay:.48s}
@keyframes up{to{opacity:1;transform:none}}

.timeline{padding-block:14px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.tl-in{max-width:1240px;margin:auto;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center}
.arrow{width:46px;height:46px;border:1px solid var(--line);background:var(--panel);color:var(--gold2);font:600 20px var(--f-display);
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);cursor:pointer;transition:border-color .2s}
.arrow:hover:not(:disabled){border-color:var(--gold)}
.arrow:disabled{opacity:.3;cursor:default}
.track{overflow-x:auto;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.eras{display:flex;gap:4px;min-width:max-content}
.eragroup{display:flex;flex-direction:column;gap:8px;padding:0 6px}
.eragroup span{font:600 10px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.eragroup.cur span{color:var(--eracol)}
.dots{display:flex;gap:4px;position:relative}
.dots:before{content:"";position:absolute;left:0;right:0;top:50%;height:1px;background:var(--line)}
.dot{position:relative;width:36px;height:22px;border:0;background:transparent;cursor:pointer;padding:0}
.dot:after{content:"";position:absolute;left:50%;top:50%;width:9px;height:9px;transform:translate(-50%,-50%) rotate(45deg);background:var(--void);border:1px solid var(--eracol);transition:all .25s}
.dot:hover:after{background:var(--eracol)}
.dot.on:after{width:14px;height:14px;background:var(--eracol);box-shadow:0 0 14px var(--eracol)}
.dot:focus-visible{outline:2px solid var(--gold2);outline-offset:2px}
.progress{height:2px;background:var(--line);margin-top:12px;max-width:1240px;margin-inline:auto}
.progress i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--accent));transition:width .6s ease}
.hint{text-align:center;font:500 11px var(--f-data);color:var(--muted);margin-top:8px}

.spoiler{position:fixed;inset:0;z-index:5;display:grid;place-items:center;background:rgba(5,8,14,.86);backdrop-filter:blur(6px);padding:16px}
.spoiler div{max-width:460px;text-align:center;border:1px solid var(--line);background:#0b121e;padding:30px}
.spoiler h2{font:700 22px var(--f-display);letter-spacing:.08em;color:var(--gold2);margin:0 0 10px;text-transform:uppercase}
.spoiler p{color:var(--muted);margin:0 0 20px}
.spoiler button{border:0;padding:12px 22px;font:700 13px var(--f-display);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;color:#05080e;background:linear-gradient(90deg,var(--gold),var(--gold2));
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px)}
@media(max-width:820px){
  body{overflow:auto}.app{height:auto;min-height:100%}
  .stage{grid-template-columns:1fr;gap:10px;padding-block:6px}
  .emblem{max-width:230px;max-height:none}
  .text{max-height:none;overflow:visible}
  .arrow{width:40px;height:40px}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.draw{stroke-dashoffset:0}.fadein,.reveal>*{opacity:1;transform:none}}
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas><div class="vignette"></div>
<div class="app">
  <div class="top"><a href="index.html">← Арсенал</a><span class="brand">Хроники Истоков</span><span class="counter" id="counter"></span></div>
  <main class="stage" id="stage" aria-live="polite"></main>
  <div class="timeline">
    <div class="tl-in">
      <button class="arrow" id="prev" aria-label="Предыдущее событие">‹</button>
      <div class="track" id="track"><div class="eras" id="eras"></div></div>
      <button class="arrow" id="next" aria-label="Следующее событие">›</button>
    </div>
    <div class="progress"><i id="bar"></i></div>
    <div class="hint">← → на клавиатуре, свайп или колесо мыши</div>
  </div>
</div>
<div class="spoiler" id="spoiler"><div><h2>Осторожно, спойлеры</h2><p>Здесь кратко пересказан сюжет Warframe, включая главные повороты квестов «Второй сон», «Жертва» и «Новая война». Если ещё не прошли их, лучше сначала пройти.</p><button id="enter">Всё равно смотреть</button></div></div>

<script>

 {id:'fall',name:'Падение',col:'#c86a6a',bg:[200,106,106]},
 {id:'wake',name:'Пробуждение',col:'#9fb8ff',bg:[159,184,255]},

const EV=[
 {era:'orokin',em:'tower',title:'Золотой век',when:'Тысячи лет назад',
  p:['Солнечной системой правит Империя Орокин: золотые башни, технологии, которые кажутся магией, и элита, продлевающая себе жизнь переносом сознания в новые тела.',
     'Империя держится на чужом труде. Грайнир — выведенные клоны-работники и солдаты, Корпус — гильдия торговцев и инженеров, служащая Орокинам.']},
 {era:'orokin',em:'sentient',title:'Сентиенты',when:'Эпоха колонизации',
  p:['Чтобы освоить далёкую систему Тау, Орокины создают самовоспроизводящиеся машины-терраформеры. Путь туда лежит через Бездну — пространство вне привычной физики.',

  p:['Сентиенты возвращаются в Солнечную систему. Они подстраиваются под любой урон и перехватывают управление орокинскими машинами.',

  p:['Колониальный корабль «Зарьман Десять-Ноль» с семьями на борту пропадает при прыжке через Бездну. Когда его находят, взрослых в живых нет.',
     'Выжили только дети. Бездна изменила их и дала силы, которых боялись даже Орокины. Этих детей позже назовут Тэнно.']},

     'Учёная Маргулис учит детей Зарьмана управлять варфреймами на расстоянии, через Трансфер. Её сострадание к детям стоит ей жизни.',

const $=id=>document.getElementById(id);
let cur=0;
const eraOf=e=>ERAS.find(x=>x.id===e.era);
// Шкала
$('eras').innerHTML=ERAS.map(er=>`<div class="eragroup" data-era="${er.id}" style="--eracol:${er.col}"><span>${er.name}</span><div class="dots">${EV.map((e,i)=>e.era===er.id?`<button class="dot" data-i="${i}" aria-label="${e.title}" title="${e.title}"></button>`:'').join('')}</div></div>`).join('');
$('eras').addEventListener('click',e=>{const b=e.target.closest('.dot');if(b)show(+b.dataset.i)});
function show(i){
  cur=Math.max(0,Math.min(EV.length-1,i));const e=EV[cur],er=eraOf(e);
  document.documentElement.style.setProperty('--accent',er.col);targetCol=er.bg;
  $('stage').innerHTML=`<div class="emblem" style="color:${er.col}"><div class="halo"></div><svg viewBox="0 0 400 400" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${EM[e.em]}</svg></div>
   <div class="text reveal"><div class="era">${er.name}</div><h1>${e.title}</h1><div class="when">${e.when}</div>${e.p.map(t=>`<p>${t}</p>`).join('')}${e.quest?`<div><span class="quest">Квест в игре: ${e.quest}</span></div>`:''}</div>`;
  document.querySelectorAll('.dot').forEach(d=>d.classList.toggle('on',+d.dataset.i===cur));
  document.querySelectorAll('.eragroup').forEach(g=>g.classList.toggle('cur',g.dataset.era===e.era));
  const on=document.querySelector('.dot.on');if(on)on.scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  $('prev').disabled=cur===0;$('next').disabled=cur===EV.length-1;
  $('counter').textContent=`${String(cur+1).padStart(2,'0')} / ${EV.length}`;
  $('bar').style.width=((cur+1)/EV.length*100)+'%';
  history.replaceState(null,'','#ev-'+(cur+1));
}
$('prev').onclick=()=>show(cur-1);$('next').onclick=()=>show(cur+1);
addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown')show(cur+1);if(e.key==='ArrowLeft'||e.key==='PageUp')show(cur-1)});
let wheelLock=0;
addEventListener('wheel',e=>{if(innerWidth<=820||e.target.closest('.text'))return;const now=Date.now();if(now-wheelLock<700)return;if(Math.abs(e.deltaY)+Math.abs(e.deltaX)<20)return;wheelLock=now;show(cur+((e.deltaY||e.deltaX)>0?1:-1))},{passive:true});
let tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx==null)return;const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>60)show(cur+(dx<0?1:-1));tx=null},{passive:true});
$('enter').onclick=()=>{$('spoiler').hidden=true;try{sessionStorage.setItem('lore-ok','1')}catch(_){}};
try{if(sessionStorage.getItem('lore-ok'))$('spoiler').hidden=true}catch(_){}

// Фон: частицы Бездны, цвет плавно меняется под эпоху
const cv=$('bg'),cx=cv.getContext('2d');let W,H,P=[],col=[214,180,106],targetCol=col;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function size(){const d=Math.min(devicePixelRatio||1,2);W=cv.width=innerWidth*d;H=cv.height=innerHeight*d;
  P=Array.from({length:Math.round(innerWidth*innerHeight/9000)},()=>({x:Math.random()*W,y:Math.random()*H,r:(Math.random()*1.6+.3)*d,v:Math.random()*.25+.05,a:Math.random()*Math.PI*2,t:Math.random()}))}
addEventListener('resize',size);size();
let tick=0;
function frame(){tick++;col=col.map((c,i)=>c+(targetCol[i]-c)*.03);
  cx.clearRect(0,0,W,H);
  const g=cx.createRadialGradient(W*.32,H*.45,0,W*.32,H*.45,Math.max(W,H)*.6);
  g.addColorStop(0,`rgba(${col.map(Math.round)},.16)`);g.addColorStop(1,'rgba(5,8,14,0)');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  for(const p of P){p.a+=.003;p.x+=Math.cos(p.a)*p.v;p.y-=p.v;if(p.y<-5){p.y=H+5;p.x=Math.random()*W}if(p.x<-5)p.x=W+5;if(p.x>W+5)p.x=-5;
    const tw=.35+.65*Math.abs(Math.sin(tick*.01+p.t*6));cx.fillStyle=`rgba(${col.map(Math.round)},${tw*.8})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()}
  if(!reduce)requestAnimationFrame(frame)}
frame();
const m=location.hash.match(/^#ev-(\d+)$/);show(m?+m[1]-1:0);
</script>
